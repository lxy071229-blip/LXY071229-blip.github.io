<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>刘笑语的个人博客</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

      background: #f7f7f7;
      color: #333;
      line-height: 1.8;
    }

    header {
      background: white;
      padding: 80px 20px 60px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    header p {
      color: #777;
      font-size: 18px;
    }

    nav {
      margin-top: 30px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      margin: 0 15px;
      transition: 0.3s;
    }

    nav a:hover {
      color: #666;
    }

    main {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 35px;
      margin-bottom: 25px;
      border-radius: 12px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .card p {
      color: #666;
    }

    .tag {
      display: inline-block;
      margin-top: 15px;
      padding: 5px 12px;
      background: #f1f1f1;
      border-radius: 20px;
      font-size: 14px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>你好，我是刘笑语 👋</h1>

    <p>
      一个正在努力成为合格大学生的准大一新生。
    </p>

    <nav>
      <a href="#about">关于我</a>
      <a href="#blog">博客</a>
      <a href="https://github.com/你的GitHub用户名">
        GitHub
      </a>
    </nav>
  </header>


  <main>

    <section class="card" id="about">
      <h2>👨‍💻 关于我</h2>

      <p>
        这里是我的个人博客。
      </p>

      <p>
        我会在这里记录一些学习、生活以及偶尔突然出现的奇怪想法。
        目前正在学习计算机相关知识，希望以后回来看这里的时候，
        至少能证明自己真的努力过。
      </p>

      <span class="tag">#准大一</span>
      <span class="tag">#计算机</span>
      <span class="tag">#学习记录</span>
    </section>


    <section class="card" id="blog">
      <h2>📝 最近更新</h2>

      <p>
        我的博客正式上线了。
      </p>

      <span class="tag">2026</span>
      <span class="tag">Hello World</span>
    </section>


    <section class="card">
      <h2>🚀 接下来</h2>

      <p>
        学一点代码，写一点东西，
        偶尔记录生活。
      </p>

      <p>
        希望这个小网站不会在三天之后停止更新。
      </p>
    </section>

  </main>


  <footer>
    © 2026 刘笑语 · Built with GitHub Pages
  </footer>

</body>
</html>
